[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batsy"
version = "0.1.0"
description = "Batsy - a voice-controlled Claude assistant that runs your Fedora laptop"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9",
  "pyserial>=3.5",
  "pillow>=10.0",
  "numpy>=1.26",
  "ddgs>=9.0",
  "pymupdf>=1.24",
  "pytesseract>=0.3",
  "python-docx>=1.1",
  "curl_cffi>=0.7",  # shopping: store pages that turn away anything that isn't a browser
]

[project.optional-dependencies]
api = [  # only for [brain] engine = "claude" (Claude API with your own key)
  "anthropic>=1.16",
]
voice = [
  "sounddevice>=0.4.6",
  "vosk>=0.3.45",
  "sherpa-onnx>=1.12",
  "piper-tts>=1.2",
  "opencv-python>=4.8",
  "PySide6>=6.6",
]
threed = [
  "trimesh>=4.0",
  "manifold3d>=2.4",
  "scipy>=1.11",
  "networkx>=3.0",
  "shapely>=2.0",
  "rtree>=1.0",
]
whisper = [
  "faster-whisper>=1.0",
]

[project.scripts]
batsy = "batsy.cli:main"

[tool.setuptools.packages.find]
include = ["batsy*"]

[tool.setuptools.package-data]
batsy = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/vendor/*", "ui/fonts/*"]
