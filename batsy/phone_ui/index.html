<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Batsy</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<!-- StandBy: swipe sideways between views; in the widgets view each half scrolls up and down through its own stack -->
<main id="views">

  <!-- 1. widgets: two stacks side by side -->
  <section class="view widgets" aria-label="Widgets">
    <div class="stack" id="left">
      <article class="w clock-w">
        <div class="time" id="w-time">--:--</div>
        <div class="date" id="w-date"></div>
        <div class="sub" id="w-next"></div>
      </article>
      <article class="w batsy-w" id="batsy-w">
        <header><span class="orb" id="orb"></span><b id="b-state">Idle</b><span class="link" id="link"><i></i><em>…</em></span></header>
        <p class="said" id="b-said">Say “Batsy”, or tap to type.</p>
        <div class="askbar"><span>Ask Batsy…</span><svg class="i" viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></div>
      </article>
      <article class="w home-w">
        <div class="tiles">
          <button class="t" data-act="light" id="t-light"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><b>Light</b><small id="t-light-s">…</small></button>
          <button class="t" data-act="night"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><b>Night</b><small>light on</small></button>
          <button class="t" data-act="pc" id="t-pc"><svg class="i" viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></svg><b>PC</b><small id="t-pc-s">…</small></button>
          <button class="t" data-act="stop"><svg class="i f" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg><b>Stop</b><small>Batsy</small></button>
        </div>
      </article>
    </div>

    <div class="stack" id="right">
      <!-- now playing: only what changed is touched (art cross-fades, the bar glides), so nothing flickers -->
      <article class="w mw" id="mw">
        <div class="mw-tint"></div>
        <div class="mw-top">
          <div class="mw-art"><img alt=""><img alt=""></div>
          <div class="mw-text"><b id="mw-title">Nothing playing</b><span id="mw-artist">Spotify</span></div>
        </div>
        <div class="mw-prog">
          <div class="mw-track"><i id="mw-bar"></i></div>
          <div class="mw-times"><span id="mw-pos">0:00</span><span id="mw-dev"></span><span id="mw-left">0:00</span></div>
        </div>
        <div class="mw-ctl">
          <button data-sp="previous" aria-label="Previous"><svg class="i f" viewBox="0 0 24 24"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.6.8L9.6 12.8a1 1 0 0 1 0-1.6l7.8-5.8a1 1 0 0 1 1.6.8z"/></svg></button>
          <button data-sp="toggle" class="mw-pp" aria-label="Play or pause"><svg class="i f ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg><svg class="i f ic-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button>
          <button data-sp="next" aria-label="Next"><svg class="i f" viewBox="0 0 24 24"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.6.8l7.8-5.8a1 1 0 0 0 0-1.6L6.6 5.4A1 1 0 0 0 5 6.2z"/></svg></button>
        </div>
      </article>
      <!-- 3D printer: the progress as liquid filling the card -->
      <article class="w pw" id="pw">
        <div class="pw-liquid" id="pw-liquid"><svg class="pw-wave back" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q 75 0 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30 V 60 H 0 Z"/></svg><svg class="pw-wave front" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q 75 0 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30 V 60 H 0 Z"/></svg><div class="pw-body"></div></div>
        <div class="pw-top"><h3>Printer</h3><span class="pw-state" id="pw-state">…</span></div>
        <div class="pw-main">
          <b id="pw-pct">–</b>
          <div class="pw-eta"><span id="pw-left"></span><small id="pw-done"></small></div>
        </div>
        <div class="pw-what"><div class="pw-name" id="pw-file"></div><b class="pw-grams" id="pw-grams"></b></div>
        <div class="pw-meta" id="pw-info"></div>
        <div class="pw-temps">Nozzle <b id="pw-noz">–</b> · Bed <b id="pw-bed">–</b></div>
        <div class="pw-btns" id="pw-btns"></div>
      </article>
      <!-- the newest slice: its picture, time and filament; 3D opens the toolpaths to turn around -->
      <article class="w sw" id="sw">
        <div class="sw-img"><img id="sw-img" alt=""></div>
        <div class="sw-info"><h3>Sliced</h3><b id="sw-title">Nothing sliced yet</b><small id="sw-meta"></small>
          <div class="sw-btns"><button id="sw-3d">3D view</button><button id="sw-print">Print</button></div></div>
      </article>
      <article class="w machines-w" id="machines-w"></article>
      <article class="w claude-w">
        <div class="rings">
          <div class="ringbox"><svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle id="r-session" class="fill" cx="50" cy="50" r="42"/></svg>
            <div class="ringlabel"><b id="c-session">–</b><small>5-hour</small></div></div>
          <div class="ringbox"><svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle id="r-week" class="fill" cx="50" cy="50" r="42"/></svg>
            <div class="ringlabel"><b id="c-week">–</b><small>week</small></div></div>
        </div>
        <div class="claude-side"><h3>Claude</h3><small id="c-reset"></small><ul id="c-sessions"></ul></div>
      </article>
      <article class="w files-w"><h3>Received <span id="f-count"></span></h3><ul id="files"></ul></article>
    </div>
  </section>

  <!-- 2. big clock -->
  <section class="view clock-full" aria-label="Clock">
    <div class="time" id="big-time">--:--</div>
    <div class="date" id="big-date"></div>
  </section>

  <!-- 3. now playing, full screen -->
  <section class="view music-full" aria-label="Now playing">
    <div class="bg" id="mf-bg"></div>
    <img id="mf-art" alt="">
    <div class="mf-side">
      <b id="mf-title">Nothing playing</b><span id="mf-artist"></span>
      <div class="progress"><div id="mf-bar"></div></div>
      <div class="times"><span id="mf-pos">0:00</span><span id="mf-dev"></span><span id="mf-dur">0:00</span></div>
      <div class="controls">
        <button data-sp="previous" aria-label="Previous"><svg class="i f" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
        <button data-sp="toggle" class="big" aria-label="Play or pause"><span class="pp"></span></button>
        <button data-sp="next" aria-label="Next"><svg class="i f" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button>
      </div>
    </div>
  </section>
</main>

<nav id="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></nav>
<button id="gear" aria-label="Settings" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<!-- ask sheet: tap the Batsy widget -->
<div id="sheet" hidden>
  <div class="panel">
    <div id="chat" class="chat"></div>
    <form id="ask" autocomplete="off">
      <input id="ask-text" type="text" placeholder="Ask Batsy anything…" enterkeyhint="send">
      <button class="go" aria-label="Send"><svg class="i f" viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
    </form>
  </div>
</div>

<!-- PC controls sheet -->
<div id="pcsheet" hidden><div class="panel" id="pcpanel"></div></div>

<div id="slice3d" hidden><iframe id="slice3d-frame" title="Slice preview"></iframe></div>
<div id="toast" role="status"></div>
<dialog id="confirm"><p id="confirm-text"></p><div class="row"><button value="no" class="ghost">Cancel</button><button value="yes" class="danger">Yes</button></div></dialog>
<script src="/app/app.js"></script>
</body>
</html>
