<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slice preview</title>
<style>
  :root { --bg: #000; --text: #f2ede2; --muted: #8d95a5; --signal: #ffc20e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.3 system-ui, Roboto, sans-serif;
    overflow: hidden; user-select: none; }
  canvas { display: block; touch-action: none; }
  .top { position: fixed; left: 16px; right: 16px; top: max(12px, env(safe-area-inset-top)); display: flex; gap: 12px;
    align-items: center; pointer-events: none; }
  .top b { font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top span { color: var(--muted); white-space: nowrap; }
  .close { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .12);
    color: var(--text); font-size: 20px; }
  .legend { position: fixed; right: 14px; top: 64px; display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .bottom { position: fixed; left: 16px; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 12px;
    align-items: center; }
  input[type=range] { flex: 1; accent-color: var(--signal); }
  .bottom span { color: var(--muted); min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
<script type="importmap">{"imports": {"three": "/app/vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="top"><b id="title">Loading…</b><span id="info"></span><button class="close" id="close" aria-label="Close">✕</button></div>
<div class="legend" id="legend"></div>
<div class="bottom"><input type="range" id="layer" min="0" max="1000" value="1000"><span id="layer-l">all layers</span></div>
<div class="msg" id="msg">Loading the slice…</div>
<script type="module">
// The sliced toolpaths in 3D: drag to turn it, pinch / scroll to zoom, the slider to scrub up through the layers.
import * as THREE from 'three';
import {OrbitControls} from '/app/vendor/OrbitControls.js';

const h = new URLSearchParams(location.hash.slice(1));
if (h.get('t')) try { localStorage.setItem('token', JSON.stringify(h.get('t'))); } catch {}
let token = ''; try { token = JSON.parse(localStorage.getItem('token') || '""'); } catch {}
const $ = s => document.querySelector(s);
$('#close').onclick = () => (window.parent !== window ? parent.postMessage({closeSlice: true}, '*') : history.back());

const res = await fetch('/api/slice/paths', {headers: {Authorization: 'Bearer ' + token}});
if (!res.ok) { $('#msg').textContent = res.status === 404 ? 'Nothing sliced yet.' : 'Couldn\'t load the slice.'; throw 0; }
const data = await res.json();
const info = await (await fetch('/api/slice', {headers: {Authorization: 'Bearer ' + token}})).json();
$('#msg').remove();
$('#title').textContent = data.title || info.title || 'Slice';
$('#info').textContent = [info.time, info.grams ? Math.round(info.grams) + ' g' : ''].filter(Boolean).join(' · ');

// int16 x,y,z (scaled) per vertex, two vertices per segment, in print order (bottom layer first)
const raw = Uint8Array.from(atob(data.pos), c => c.charCodeAt(0));
const ints = new Int16Array(raw.buffer);
const n = ints.length / 3;
const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
let zmin = Infinity, zmax = -Infinity;
for (let i = 0; i < n; i++) { const z = ints[i * 3 + 2] / data.scale; zmin = Math.min(zmin, z); zmax = Math.max(zmax, z); }
const bands = data.bands || [];
const bandColour = i => new THREE.Color().setHSL(0.66 * (bands.length > 1 ? i / (bands.length - 1) : 0), 0.85, 0.55);
const heat = t => new THREE.Color().setHSL(0.78 - 0.68 * t, 0.9, 0.55);  // purple at the bottom -> orange at the top
const c = new THREE.Color();
const zs = new Float32Array(n);
for (let i = 0; i < n; i++) {
  const x = ints[i * 3] / data.scale, y = ints[i * 3 + 1] / data.scale, z = ints[i * 3 + 2] / data.scale;
  pos.set([x, z, -y], i * 3);  // the printer's Z is up: three.js's Y
  zs[i] = z;
  if (bands.length) { let b = 0; while (b + 1 < bands.length && z >= bands[b + 1].z) b++; c.copy(bandColour(b)); }
  else c.copy(heat((z - zmin) / Math.max(1e-6, zmax - zmin)));
  col.set([c.r, c.g, c.b], i * 3);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
geo.computeBoundingBox();
const box = geo.boundingBox, centre = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({vertexColors: true, transparent: true, opacity: 0.95}));
lines.position.sub(centre);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.add(lines);
const grid = new THREE.GridHelper(Math.max(size.x, size.z) * 1.6, 16, 0x2a2f3a, 0x1a1e27);
grid.position.y = -size.y / 2 - 0.2;
scene.add(grid);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
const r = Math.max(size.x, size.y, size.z);
camera.position.set(r * 1.3, r * 0.9, r * 1.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;            // turns slowly until you touch it
controls.autoRotateSpeed = 1.2;
controls.addEventListener('start', () => { controls.autoRotate = false; });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// legend: each temperature band (calibration towers)
$('#legend').innerHTML = bands.slice().reverse().map((b, k) => {
  const i = bands.length - 1 - k, cc = bandColour(i);
  return `<div style="color:#${cc.getHexString()}"><i style="background:#${cc.getHexString()}"></i>${b.temp}°</div>`;
}).join('');

// the slider: show the print up to a height, like scrubbing through the layers
$('#layer').oninput = e => {
  const f = +e.target.value / 1000, zcut = zmin + (zmax - zmin) * f;
  let k = n; if (f < 1) { k = 0; while (k < n && zs[k] <= zcut + 1e-6) k += 2; }
  geo.setDrawRange(0, k);
  $('#layer-l').textContent = f >= 1 ? 'all layers' : `up to ${zcut.toFixed(1)} mm`;
};
</script>
</body>
</html>
