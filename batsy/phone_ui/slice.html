<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slice preview</title>
<style>
  :root { --bg: #1d2026; --panel: rgba(24, 27, 33, .86); --line: rgba(255, 255, 255, .1); --text: #ece7db; --muted: #8d95a5;
    --signal: #ffc20e; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #2a2e36, #15171c 75%); color: var(--text);
    font: 14px/1.3 system-ui, Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  .glass { background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line);
    border-radius: 16px; }
  .top { position: fixed; left: 12px; right: 12px; top: max(10px, env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center;
    pointer-events: none; }
  .top > * { pointer-events: auto; }
  .ttl { padding: 8px 14px; display: flex; flex-direction: column; min-width: 0; }
  .ttl b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--text); white-space: nowrap; }
  .chip.y { background: rgba(255, 194, 14, .16); color: var(--signal); }
  .btn { height: 38px; min-width: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: 600 13px/1 system-ui; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .btn.on { background: var(--signal); color: #000; border-color: transparent; }
  .sp { flex: 1; }
  .legend { position: fixed; right: 12px; top: 78px; width: 230px; max-height: calc(100% - 210px); overflow: auto; padding: 10px;
    transition: transform .25s ease, opacity .25s; }
  .legend.hide { transform: translateX(110%); opacity: 0; }
  .legend h4 { margin: 2px 4px 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    display: flex; justify-content: space-between; }
  .seg { display: flex; gap: 4px; margin: 0 4px 10px; }
  .seg button { flex: 1; height: 28px; border-radius: 9px; border: 0; background: rgba(255, 255, 255, .07); color: var(--text); font: 600 12px system-ui; }
  .seg button.on { background: rgba(255, 194, 14, .2); color: var(--signal); }
  .feat { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
  .feat:active { background: rgba(255, 255, 255, .06); }
  .feat i { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .feat span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feat small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .feat.off { opacity: .35; } .feat.off i { background: transparent !important; outline: 2px solid currentColor; outline-offset: -2px; }
  .bottom { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px 14px;
    display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { width: 54px; color: var(--muted); font-size: 12px; }
  .row input[type=range] { flex: 1; accent-color: var(--signal); height: 28px; }
  .row .val { min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .row .btn { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 9px; }
  @media (max-width: 640px) { .legend { width: 200px; } .row .val { min-width: 104px; font-size: 12px; } .row label { width: 44px; } }
  @media (max-height: 520px) {  /* a phone on its side: slimmer panels, more model */
    .top { top: 6px; } .ttl { padding: 5px 10px; } .ttl b { font-size: 14px; } .chip { font-size: 11px; padding: 2px 7px; }
    .bottom { padding: 6px 10px; gap: 2px; } .row input[type=range] { height: 22px; } .row .btn { height: 26px; min-width: 26px; }
    .legend { top: 60px; max-height: calc(100% - 150px); } }
  .msg { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted);
    text-align: center; padding: 24px; }
  .fillbat { width: min(220px, 56vw); height: auto; overflow: visible; filter: drop-shadow(0 0 18px rgba(255, 194, 14, .25)); }
  #level { transition: transform .35s ease-out; }
  .wave { fill: var(--signal); }
  .wave.back { opacity: .45; animation: wave 2.6s linear infinite reverse; }
  .wave.front { animation: wave 1.8s linear infinite; }
  @keyframes wave { from { transform: translateX(0); } to { transform: translateX(12px); } }
  .msg b { color: var(--text); font-size: 17px; }
  .msg small { font-variant-numeric: tabular-nums; }
</style>
<script type="importmap">{"imports": {"three": "/app/vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="top">
  <button class="btn" id="close" aria-label="Close">✕</button>
  <div class="ttl glass"><b id="title">Loading…</b><div class="chips" id="chips"></div></div>
  <div class="sp"></div>
  <button class="btn" id="tg-legend">Legend</button>
</div>
<div class="legend glass" id="legend">
  <div class="seg" id="mode"></div>
  <h4><span>Line type</span><span>share</span></h4>
  <div id="feats"></div>
</div>
<div class="bottom glass">
  <div class="row"><label>Layer</label><button class="btn" id="lprev">‹</button>
    <input type="range" id="layer" min="1" max="1" value="1"><button class="btn" id="lnext">›</button>
    <span class="val" id="layer-l"></span><button class="btn" id="single" title="Only this layer">1</button></div>
  <div class="row"><label>Moves</label><button class="btn" id="play">▶</button>
    <input type="range" id="move" min="0" max="1000" value="1000"><span class="val" id="move-l">whole layer</span></div>
</div>
<div class="msg" id="msg">
  <svg class="fillbat" viewBox="0 4 24 14" aria-hidden="true">
    <defs><clipPath id="batclip"><path d="M12,15.6c-0.4,-1.3 -1.2,-2.1 -2.4,-2.2c-0.6,-1.5 -2.1,-2.3 -3.9,-1.9c0.5,-1.2 0.2,-2.6 -0.8,-3.6C3.3,8.6 1.9,9.9 1,11.6c1.5,-0.4 2.8,0 3.6,1.1c1.3,-0.5 2.8,0 3.4,1.3c1.4,0 2.6,0.8 3,2.2l0.5,0.6l0.5,-0.6c0.4,-1.4 1.6,-2.2 3,-2.2c0.6,-1.3 2.1,-1.8 3.4,-1.3c0.8,-1.1 2.1,-1.5 3.6,-1.1c-0.9,-1.7 -2.3,-3 -4.1,-3.7c-1,1 -1.3,2.4 -0.8,3.6c-1.8,-0.4 -3.3,0.4 -3.9,1.9c-0.4,0 -0.8,0.1 -1.1,0.3l-0.2,-1.3l-0.5,0.6l-0.5,-0.6l-0.2,1.3C12.8,13.5 12.4,13.4 12,13.4z"/></clipPath></defs>
    <path d="M12,15.6c-0.4,-1.3 -1.2,-2.1 -2.4,-2.2c-0.6,-1.5 -2.1,-2.3 -3.9,-1.9c0.5,-1.2 0.2,-2.6 -0.8,-3.6C3.3,8.6 1.9,9.9 1,11.6c1.5,-0.4 2.8,0 3.6,1.1c1.3,-0.5 2.8,0 3.4,1.3c1.4,0 2.6,0.8 3,2.2l0.5,0.6l0.5,-0.6c0.4,-1.4 1.6,-2.2 3,-2.2c0.6,-1.3 2.1,-1.8 3.4,-1.3c0.8,-1.1 2.1,-1.5 3.6,-1.1c-0.9,-1.7 -2.3,-3 -4.1,-3.7c-1,1 -1.3,2.4 -0.8,3.6c-1.8,-0.4 -3.3,0.4 -3.9,1.9c-0.4,0 -0.8,0.1 -1.1,0.3l-0.2,-1.3l-0.5,0.6l-0.5,-0.6l-0.2,1.3C12.8,13.5 12.4,13.4 12,13.4z" fill="rgba(255,255,255,.10)"/>
    <g clip-path="url(#batclip)">
      <g id="level" style="transform: translateY(12px)">
        <path class="wave back" d="M-24 9 Q -21 8 -18 9 T -12 9 T -6 9 T 0 9 T 6 9 T 12 9 T 18 9 T 24 9 T 30 9 T 36 9 T 42 9 T 48 9 V 30 H -24 Z"/>
        <path class="wave front" d="M-24 9 Q -21 10 -18 9 T -12 9 T -6 9 T 0 9 T 6 9 T 12 9 T 18 9 T 24 9 T 30 9 T 36 9 T 42 9 T 48 9 V 30 H -24 Z"/>
      </g>
    </g>
  </svg>
  <b id="msg-t">Downloading toolpaths</b>
  <small id="msg-n">connecting…</small>
</div>
<script type="module">
// The slicing, as a slicer shows it: every extrusion line at its real width, coloured by what it is (outer wall,
// inner wall, infill, top surface, ironing...), on the 220 x 220 plate. Layer slider, a "moves" slider that plays
// the top layer move by move (with the nozzle), tap a line type to hide it, colour by type / height / temperature.
import * as THREE from 'three';
import {OrbitControls} from '/app/vendor/OrbitControls.js';
import {LineSegments2} from '/app/vendor/LineSegments2.js';
import {LineSegmentsGeometry} from '/app/vendor/LineSegmentsGeometry.js';
import {LineMaterial} from '/app/vendor/LineMaterial.js';

const h = new URLSearchParams(location.hash.slice(1));
if (h.get('t')) try { localStorage.setItem('token', JSON.stringify(h.get('t'))); } catch {}
let token = ''; try { token = JSON.parse(localStorage.getItem('token') || '""'); } catch {}
const $ = s => document.querySelector(s);
$('#close').onclick = () => (window.parent !== window ? parent.postMessage({closeSlice: true}, '*') : history.back());

// --- the toolpaths, with the filling bat ------------------------------------------------------------------------------
const res = await fetch('/api/slice/paths', {headers: {Authorization: 'Bearer ' + token}});
if (!res.ok) { $('#msg-t').textContent = res.status === 404 ? 'Nothing sliced yet.' : 'Couldn\'t load the slice.';
  $('#msg-n').textContent = ''; throw 0; }
const total = +res.headers.get('X-Raw-Length') || +res.headers.get('Content-Length') || 0, mb = n => (n / 1e6).toFixed(1);  // (sent zipped)
const fill = f => { document.getElementById('level').style.transform = `translateY(${(1 - Math.min(1, f)) * 12 - 3}px)`; };
fill(0.04);
const t0 = performance.now();
let got = 0; const parts = [];
for (const reader = res.body.getReader();;) {
  const {done, value} = await reader.read();
  if (done) break;
  parts.push(value); got += value.length;
  if (total) {
    fill(got / total);
    const left = Math.max(0, (total - got) / (got / Math.max((performance.now() - t0) / 1000, 0.05)));
    $('#msg-n').textContent = `${Math.round(100 * got / total)}% · ${mb(got)} of ${mb(total)} MB` + (left > 1.5 ? ` · ${Math.ceil(left)} s left` : '');
  } else { $('#msg-n').textContent = `${mb(got)} MB`; fill(Math.min(0.9, got / 6e6)); }
}
$('#msg-t').textContent = 'Building the 3D view'; fill(1); $('#msg-n').textContent = '';
await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
const buf = new Uint8Array(got); { let o = 0; for (const p of parts) { buf.set(p, o); o += p.length; } }
const data = JSON.parse(new TextDecoder().decode(buf));
const info = await (await fetch('/api/slice', {headers: {Authorization: 'Bearer ' + token}})).json().catch(() => ({}));

const bytes = b => Uint8Array.from(atob(b || ''), c => c.charCodeAt(0));
const ints = new Int16Array(bytes(data.pos).buffer);
const N = ints.length / 6;
const featOf = data.feat ? bytes(data.feat) : new Uint8Array(N);
const layerOf = data.layer ? new Uint16Array(bytes(data.layer).buffer) : new Uint16Array(N);
const layers = data.layers && data.layers.length ? data.layers : [{z: 0, h: 0.2}];
const L = Math.max(1, layers.length, layerOf.length ? layerOf[N - 1] + 1 : 1);
const names = data.features || ['Extrusion'], palette = (data.colors || ['#ff7d38']).map(c => new THREE.Color(c));
const bands = data.bands || [];
const S = data.scale || 20;

// --- top bar ----------------------------------------------------------------------------------------------------------------
$('#title').textContent = info.title || data.title || 'Slice';
// the usual layer height (the first layer is often thicker; a few odd ones don't count)
const hc = {}; layers.slice(1).forEach(l => { hc[l.h] = (hc[l.h] || 0) + 1; });
const lh = Object.entries(hc).filter(([, n]) => n >= Math.max(3, L * 0.05)).map(([k]) => +k).sort((a, b) => a - b);
$('#chips').innerHTML = [info.time && `<span class="chip y">⏱ ${info.time}</span>`, info.grams && `<span class="chip y">${Math.round(info.grams)} g</span>`,
  info.metres && `<span class="chip">${info.metres} m</span>`, `<span class="chip">${L} layers</span>`,
  lh.length && `<span class="chip">${lh.length === 1 ? lh[0] : Math.min(...lh) + '–' + Math.max(...lh)} mm layers</span>`]
  .filter(Boolean).join('');

// --- colour modes and the legend -------------------------------------------------------------------------------------
const present = names.map((_, i) => i).filter(i => featOf.includes(i));
const amount = data.amount_mm || {};
const totalAmt = Object.values(amount).reduce((a, b) => a + b, 0) || 1;
const hidden = new Set();
const modes = [['type', 'Line type'], ['height', 'Height'], ...(bands.length ? [['temp', 'Temperature']] : [])];
let mode = bands.length ? 'temp' : 'type';
const heat = t => new THREE.Color().setHSL(0.72 - 0.68 * t, 0.85, 0.55);
const bandColour = i => new THREE.Color().setHSL(0.66 * (bands.length > 1 ? i / (bands.length - 1) : 0), 0.85, 0.55);
function drawLegend() {
  $('#mode').innerHTML = modes.map(([k, t]) => `<button data-m="${k}" class="${k === mode ? 'on' : ''}">${t}</button>`).join('');
  if (mode === 'type') {
    $('#feats').innerHTML = present.map(i => `<div class="feat ${hidden.has(i) ? 'off' : ''}" data-f="${i}" style="color:#${palette[i].getHexString()}">
      <i style="background:#${palette[i].getHexString()}"></i><span style="color:var(--text)">${names[i]}</span>
      <small>${Math.round(100 * (amount[names[i]] || 0) / totalAmt)}%</small></div>`).join('');
  } else if (mode === 'temp') {
    $('#feats').innerHTML = bands.slice().reverse().map((b, k) => { const c = bandColour(bands.length - 1 - k).getHexString();
      return `<div class="feat"><i style="background:#${c}"></i><span>${b.temp} °C</span><small>from ${b.z} mm</small></div>`; }).join('');
  } else {
    const zt = layers[layers.length - 1].z;
    $('#feats').innerHTML = [1, .75, .5, .25, 0].map(t => `<div class="feat"><i style="background:#${heat(t).getHexString()}"></i>
      <span>${(zt * t).toFixed(1)} mm</span></div>`).join('');
  }
}
$('#mode').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; drawLegend(); rebuild(); });
$('#feats').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (!f) return;
  const i = +f.dataset.f; hidden.has(i) ? hidden.delete(i) : hidden.add(i); drawLegend(); rebuild();
});
$('#tg-legend').onclick = () => $('#legend').classList.toggle('hide');
if (innerWidth < 700 || innerHeight < 520) $('#legend').classList.add('hide');  // small screens: on tap

// --- the scene: plate, lights, camera ----------------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));  // a million lines at 3x on a phone was what made it crawl
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
// the build plate, 220 x 220 (G-code coordinates are bed coordinates): printer X -> three X, Y -> -Z, Z -> Y
const plate = new THREE.Mesh(new THREE.PlaneGeometry(220, 220).rotateX(-Math.PI / 2).translate(110, -0.05, -110),
  new THREE.MeshBasicMaterial({color: 0x2b2f37}));
scene.add(plate);
const grid = new THREE.GridHelper(220, 22, 0x3d434e, 0x353a44); grid.position.set(110, 0, -110); scene.add(grid);
const rim = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(220, 0.01, 220)), new THREE.LineBasicMaterial({color: 0x59606c}));
rim.position.set(110, 0, -110); scene.add(rim);
const nozzle = new THREE.Mesh(new THREE.ConeGeometry(1.2, 3, 16).rotateX(Math.PI).translate(0, 1.5, 0),
  new THREE.MeshBasicMaterial({color: 0xffc20e}));
nozzle.visible = false; scene.add(nozzle);

let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
for (let i = 0; i < N * 2; i++) for (let a = 0; a < 3; a++) { const v = ints[i * 3 + a] / S; if (v < lo[a]) lo[a] = v; if (v > hi[a]) hi[a] = v; }
const centre = new THREE.Vector3((lo[0] + hi[0]) / 2, (lo[2] + hi[2]) / 2, -(lo[1] + hi[1]) / 2);
const span = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2], 20);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 4000);
camera.position.set(centre.x + span * 1.15, centre.y + span * 0.95, centre.z + span * 1.35);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(centre); controls.enableDamping = true;

const mat = new LineMaterial({vertexColors: true, worldUnits: true, linewidth: 0.42, alphaToCoverage: false});
// What a slicer actually shows: below the layer you're looking at, only what can be seen from outside (outer walls,
// top/bottom surfaces, overhangs, bridges, ironing, brim): ~1 line in 5. The inner walls and infill of those layers
// are hidden behind the walls anyway. The top layer has everything, so scrubbing and the move player see inside.
// Building and turning ~a million real-width lines made a phone crawl.
const SHELL = new Set(names.map((nm, i) => /outer wall|overhang|top surface|bottom surface|^bridge|ironing|brim|skirt/i.test(nm) ? i : -1));
let shell = null, shellStart = new Uint32Array(L + 1);   // the outside, of every layer
let topLines = null, topIdx = new Uint32Array(0), topFor = -1;  // everything, of the top layer
const light = new THREE.Vector3(0.45, 0.8, 0.4).normalize();
const c = new THREE.Color();
let single = false;
function colourOf(i, z) {
  if (mode === 'type') return c.copy(palette[featOf[i]] || palette[0]);
  if (mode === 'temp') { let b = 0; while (b + 1 < bands.length && z >= bands[b + 1].z) b++; return c.copy(bandColour(b)); }
  return c.copy(heat((z - lo[2]) / Math.max(1e-6, hi[2] - lo[2])));
}
function makeLines(pick, count) {  // real-width lines for these lines (indices into the data), shaded like a preview
  const pos = new Float32Array(Math.max(1, count) * 6), col = new Float32Array(Math.max(1, count) * 6);
  for (let j = 0; j < count; j++) {
    const i = pick[j], o = i * 6, q = j * 6;
    const x0 = ints[o] / S, y0 = ints[o + 1] / S, z0 = ints[o + 2] / S, x1 = ints[o + 3] / S, y1 = ints[o + 4] / S, z1 = ints[o + 5] / S;
    pos[q] = x0; pos[q + 1] = z0; pos[q + 2] = -y0; pos[q + 3] = x1; pos[q + 4] = z1; pos[q + 5] = -y1;
    // shade by the line's direction against the light: walls get light and shadow, like a real preview
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
    colourOf(i, z0).multiplyScalar(0.62 + 0.38 * Math.abs((-dy / len) * light.x + (dx / len) * light.z));
    col[q] = col[q + 3] = c.r; col[q + 1] = col[q + 4] = c.g; col[q + 2] = col[q + 5] = c.b;
  }
  const g = new LineSegmentsGeometry();
  g.setPositions(pos); g.setColors(col);
  return new LineSegments2(g, mat);
}
function swap(old, now) { if (old) { scene.remove(old); old.geometry.dispose(); } scene.add(now); return now; }
// the outside of every layer (rebuilt when you hide a line type or change the colours)
function rebuild() {
  const pick = new Uint32Array(N); let n = 0;
  shellStart = new Uint32Array(L + 1);
  for (let i = 0, k = 0; i < N; i++) {
    while (k < layerOf[i]) shellStart[++k] = n;
    if (SHELL.has(featOf[i]) && !hidden.has(featOf[i])) pick[n++] = i;
  }
  for (let k = 1; k <= L; k++) if (!shellStart[k] && k > layerOf[N - 1]) shellStart[k] = n;
  shell = swap(shell, makeLines(pick, n));
  topFor = -1;
  applyRange();
}
// everything of one layer, in print order
function buildTop(top) {
  const pick = [];
  for (let i = 0; i < N; i++) if (layerOf[i] === top && !hidden.has(featOf[i])) pick.push(i);
  topIdx = Uint32Array.from(pick);
  topLines = swap(topLines, makeLines(topIdx, topIdx.length));
  topFor = top;
}

// --- sliders ------------------------------------------------------------------------------------------------------------
const lay = $('#layer'), mv = $('#move');
lay.max = L; lay.value = L;
let playing = null;
let applyRange = function () {
  const top = +lay.value - 1;
  if (top !== topFor) buildTop(top);
  shell.geometry.instanceCount = single ? 0 : shellStart[top];  // the outside of every layer below this one
  const inLayer = topIdx.length, f = +mv.value / 1000, end = Math.round(inLayer * f);
  topLines.geometry.instanceCount = end;  // this layer, up to here in print order
  const L0 = layers[top] || {z: 0, h: 0};
  $('#layer-l').textContent = `${top + 1} / ${L} · Z ${(+L0.z).toFixed(2)} · ${(+L0.h).toFixed(2)} mm`;
  $('#move-l').textContent = f >= 1 ? 'whole layer' : `${end} / ${inLayer} moves`;
  // the nozzle sits at the end of the last line drawn while scrubbing
  nozzle.visible = f < 1 && end > 0;
  if (nozzle.visible) { const o = topIdx[end - 1] * 6; nozzle.position.set(ints[o + 3] / S, ints[o + 5] / S, -ints[o + 4] / S); }
};
lay.oninput = () => { mv.value = 1000; applyRange(); };
mv.oninput = applyRange;
$('#lprev').onclick = () => { lay.value = Math.max(1, +lay.value - 1); mv.value = 1000; applyRange(); };
$('#lnext').onclick = () => { lay.value = Math.min(L, +lay.value + 1); mv.value = 1000; applyRange(); };
$('#single').onclick = () => { single = !single; $('#single').classList.toggle('on', single); applyRange(); };
$('#play').onclick = () => {
  if (playing) { cancelAnimationFrame(playing); playing = null; $('#play').textContent = '▶'; return; }
  if (+mv.value >= 1000) mv.value = 0;
  $('#play').textContent = '❚❚';
  const step = () => { mv.value = Math.min(1000, +mv.value + 4); applyRange();
    playing = +mv.value < 1000 ? requestAnimationFrame(step) : ($('#play').textContent = '▶', null); };
  playing = requestAnimationFrame(step);
};

function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  mat.resolution.set(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();
drawLegend(); rebuild();
$('#msg').remove();
// Draw only when something changed (you turn it, zoom, move a slider): drawing ~a million lines 60 times a second,
// even when nothing moved, slowed the whole app down. Nothing at all while the page is hidden.
// #fps=1 in the address: frames per second while moving, in the corner (for testing)
const FPS = h.get('fps') ? (() => { const el = Object.assign(document.createElement('div'), {style:
  'position:fixed;left:50%;top:90px;z-index:999;font:700 26px system-ui;color:#ffc20e;background:#000a;padding:4px 10px'}); document.body.append(el);
  let n = 0, t = performance.now();
  return {tick() { n++; const now = performance.now(); if (now - t > 500) { el.textContent = Math.round(n * 1000 / (now - t)) + ' fps'; n = 0; t = now; } }};
})() : null;
let queued = false;
function draw() {
  if (queued || document.hidden) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const moving = controls.update();  // true while it's still gliding after you let go
    renderer.render(scene, camera);
    if (FPS) FPS.tick();
    if (moving) draw();
  });
}
controls.addEventListener('change', draw);
for (const el of [lay, mv]) el.addEventListener('input', draw);
document.addEventListener('click', () => setTimeout(draw, 0));  // legend, layer buttons, modes
addEventListener('resize', draw);
document.addEventListener('visibilitychange', draw);
const _apply = applyRange;  // the move player and every slider change go through here
applyRange = (...a) => { const r = _apply(...a); draw(); return r; };
draw();
</script>
</body>
</html>
