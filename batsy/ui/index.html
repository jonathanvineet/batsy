<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batsy</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="world">
<canvas id="sky"></canvas>

<main id="talk">
  <div id="status" hidden><span class="ind"><i></i><i></i><i></i></span><span class="label"></span><span class="secs"></span></div>
  <div id="thread"></div>
</main>

<section id="stage">
  <figure id="media" hidden><img id="pic" alt=""><figcaption></figcaption></figure>
  <article id="card" hidden><h2></h2><div class="body"></div></article>
  <div id="viewer" hidden>
    <canvas></canvas>
    <div class="labels"></div>
    <div class="hud"><p class="lines"></p><p class="message"></p></div>
    <p class="hint">Try “rotate it 90 degrees”, “top view”, “cut it in half”, “explode it” or “measure”</p>
  </div>
</section>

<section id="showcase" hidden>
  <header><h1>Batsy <span>what I can do</span></h1><p class="meta"><i class="rec"></i><span class="up">live</span></p></header>
  <div class="live">
    <div class="dial">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#ffc20e"/><stop offset=".6" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ff5c4d"/>
          </linearGradient>
          <radialGradient id="glow"><stop offset="0" stop-color="var(--heat)" stop-opacity=".28"/><stop offset="1" stop-color="var(--heat)" stop-opacity="0"/></radialGradient>
        </defs>
        <circle class="halo" cx="120" cy="120" r="118" fill="url(#glow)"/>
        <g class="ticks"></g>
        <path class="track" d=""/>
        <path class="value" d=""/>
        <path class="limit" d=""/>
        <g class="sweep"><line x1="120" y1="120" x2="120" y2="22"/></g>
      </svg>
      <div class="read"><b class="t">--</b><small>°C</small><p class="what">CPU package</p><p class="hot"></p></div>
    </div>
    <svg class="trace" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true">
      <line class="lim" x1="0" x2="300"/><path class="area"/><path class="line"/>
    </svg>
    <p class="trace-label"><span>Last 90 seconds</span><span class="range"></span></p>
    <div class="cores"></div>
    <dl class="chips"></dl>
  </div>
  <ol class="tiles"></ol>
</section>

<p id="subtitle"></p>

<section id="saver" hidden>
  <header class="clock"><time class="hm"></time><p class="date"></p></header>
  <div class="grid"></div>
  <p class="foot">Say “Batsy” any time</p>
</section>

<form id="typebox" autocomplete="off"><input type="text" spellcheck="false" placeholder="Type to Batsy…"
  aria-label="Type to Batsy"><span class="hint">Enter to send · Esc to close</span></form>
</div>
<div id="flybat" aria-hidden="true"></div>
<script type="module" src="app.js"></script>
</body>
</html>
