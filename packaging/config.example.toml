# Batsy settings. Every key is optional; delete what you don't change.
# Restart Batsy after editing (or say "Batsy, restart yourself").

[claude]
model = "claude-opus-5-5"   # or "claude-sonnet-5-5" for cheaper/faster
effort = "low"              # low | medium | high | xhigh | max (higher = more thinking tokens)
web_tools = true            # web search + fetch
compact_at_tokens = 50000   # summarise older conversation beyond this
clear_tool_results_at = 20000  # drop old tool outputs/images beyond this (0 = never)

[user]
# name = "Jonathan"
# about = "a college student who codes every day (Python, web, Arduino and ESP32) and does 3D design, modelling and 3D printing"

[github]
# user = "your-github-username"   # empty = worked out from your git identity; GITHUB_TOKEN in env for private repos

[projects]
# roots = ["~/code", "~/Documents"]   # where to look for project folders; empty = your whole home folder

[spotify]
client_id = ""              # from developer.spotify.com, then run: batsy spotify-login
device = "ipad"             # control the Spotify device whose name contains this

[camera]
name = "lenovo"             # picks the webcam whose name contains this
# device = 2                # or force /dev/video2
snapshot_edge = 768         # pixels per look; smaller = fewer tokens

[voice]
# lexicon = ["developer", "3d", "student"]   # vocabulary Parakeet expects and repairs (batsy/lexicon.py)
wake_words = ["batsy", "bat see", "bats see", "betsy", "batsie", "bitsy", "patsy"]
whisper_model = "base.en"  # tiny.en = faster, small.en / medium.en = more accurate but slower
piper_voice = "en_GB-alan-medium"
follow_up_seconds = 6       # listen for a follow-up without the wake word; 0 to disable
barge_in = true             # say "Batsy" while it's talking to interrupt
# input_device = "USB Microphone"

[safety]
confirm_dangerous = true    # ask by voice before rm -rf, dnf remove, shutdown, ...

[monitor]
battery_low_percent = 15
cpu_temp_high_c = 90
disk_free_low_gb = 5
